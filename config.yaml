      description: 围绕 LLM/VLM 高效压缩与适配的研究检索关键词
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: post-training quantization
          keyword_cn: 训练后量化
          query: post-training quantization techniques for large language models including GPTQ AWQ SmoothQuant and OmniQuant
        - keyword: quantization-aware low-rank adaptation
          keyword_cn: 量化感知低秩适配
          query: joint quantization and low-rank adaptation for memory efficient fine-tuning of large models
        - keyword: orthogonal rotation quantization
          keyword_cn: 正交旋转量化
          query: applying orthogonal rotation or Hadamard transforms to reduce outlier effects in weight quantization
        - keyword: visual token pruning
          keyword_cn: 视觉令牌剪枝
          query: reducing the number of visual tokens in vision language models through pruning and merging
        - keyword: video temporal token compression
          keyword_cn: 视频时态令牌压缩
          query: compressing video tokens while preserving temporal grounding and event detection
        - keyword: multimodal quantization sensitivity
          keyword_cn: 多模态量化敏感性
          query: quantization sensitivity of visual and textual modalities in vision language models
      intent_queries:
        - query: How does orthogonal rotation affect the low rank structure of quantization error in large language models?
          query_cn: 正交旋转如何影响大语言模型中量化误差的低秩结构？
          enabled: true
          source: manual
          note: ''
        - query: Can low rank adapters reconstruct quantization error after rotation better than before rotation?
          query_cn: 低秩适配器能否在旋转后更好地重建量化误差？
          enabled: true
          source: manual
          note: ''
        - query: >-
