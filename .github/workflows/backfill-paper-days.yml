name: backfill-paper-days
run-name: Recover DPR 2026-10-12 through 2026-10-21
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/backfill-paper-days.yml
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-paper-reader
  cancel-in-progress: false
jobs:
  recover:
    name: Recover ${{ matrix.paper_date }}
    if: github.repository == 'SYMAAA/daily-paper-reader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        paper_date:
        - '2026-10-12'
        - '2026-10-13'
        - '2026-10-14'
        - '2026-10-15'
        - '2026-10-16'
        - '2026-10-17'
        - '2026-10-18'
        - '2026-10-19'
        - '2026-10-20'
        - '2026-10-21'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      RERANK_PROFILE: ${{ secrets.RERANK_PROFILE }}
      RERANK_PROVIDER: ${{ secrets.RERANK_PROVIDER }}
      RERANK_MODEL: ${{ secrets.RERANK_MODEL }}
      RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
      RERANK_API_BASE_URL: ${{ secrets.RERANK_API_BASE_URL }}
      PUBLIC_RERANK_API_KEY: ${{ secrets.PUBLIC_RERANK_API_KEY }}
      PUBLIC_RERANK_API_BASE_URL: ${{ secrets.PUBLIC_RERANK_API_BASE_URL || 'https://zwwen.online/rerank' }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_RERANK_URL: ${{ secrets.SILICONFLOW_RERANK_URL }}
      SILICONFLOW_RERANK_MIN_INTERVAL_SECONDS: ${{ secrets.SILICONFLOW_RERANK_MIN_INTERVAL_SECONDS || '8' }}
      LOCAL_RERANK_MODEL: ${{ secrets.LOCAL_RERANK_MODEL || 'Qwen/Qwen3-Reranker-0.6B' }}
      LOCAL_RERANK_DEVICE: cpu
      LOCAL_RERANK_BATCH_SIZE: '4'
      MKL_THREADING_LAYER: GNU
      DPR_RERANK_GLOBAL_POOL_LIMIT: '120'
      DPR_RERANK_GUARANTEED_PER_LANE: '2'
      DPR_EMBED_API_TIMEOUT: '60'
      DPR_EMBED_API_URL: ${{ secrets.DPR_EMBED_API_URL || 'https://zwwen.online/embed' }}
      DPR_EMBED_API_KEY: ${{ secrets.DPR_EMBED_API_KEY }}
      LLM_PRIMARY_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL }}
      SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
      SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
      SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: main
    - name: Check completed target before installing dependencies
      id: target
      env:
        PAPER_DATE: ${{ matrix.paper_date }}
      run: |-
        python - <<'PYTHON'
        import json, os
        from pathlib import Path
        value = os.environ['PAPER_DATE']
        token = value.replace('-', '')
        archive = Path('archive') / token
        docs = Path('docs') / token[:6] / token[6:]
        recommend = archive / 'recommend' / f'arxiv_papers_{token}.standard.json'
        complete = all(p.is_file() for p in [recommend, docs/'README.md', docs/'_daily_state.json', docs/'papers.meta.json'])
        if complete:
            json.loads(recommend.read_text())
            result = 'true'
            print(f'{value}: complete archive already exists; skipping')
        elif archive.exists() or docs.exists() or (Path('docs')/token).exists():
            raise SystemExit(f'{value}: partial target exists; refusing to overwrite')
        else:
            result = 'false'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            print(f'skip={result}', file=out)
        PYTHON
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      if: steps.target.outputs.skip != 'true'
    - name: Cache Python deps
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
          ~/.cache/torch
          ~/.cache/dpr-tools/papercropper
        key: ${{ runner.os }}-dpr-embed-deps-v1-${{ hashFiles('requirements.txt') }}
      if: steps.target.outputs.skip != 'true'
    - name: Install deps (skip sqlite3)
      run: |
        python - <<'PY'
        import re
        lines = open("requirements.txt", "r", encoding="utf-8").read().splitlines()
        lines = [l for l in lines if l.strip() and not re.match(r"^sqlite3\\b", l)]
        open("/tmp/req.txt", "w", encoding="utf-8").write("\n".join(lines))
        PY
        python -m pip install --upgrade pip
        python -m pip install uv
        python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
        uv pip install --system -r /tmp/req.txt
      if: steps.target.outputs.skip != 'true'
    - name: Prepare PaperCropper (optional)
      continue-on-error: true
      run: |
        set -euo pipefail

        TOOL_DIR="$HOME/.cache/dpr-tools/papercropper"
        SRC_DIR="$TOOL_DIR/PaperCropper"
        MODEL_DIR="$TOOL_DIR/models"
        MODEL_PATH="$MODEL_DIR/doclayout_yolo_docstructbench_imgsz1280_2501.pt"

        mkdir -p "$TOOL_DIR" "$MODEL_DIR"
        if [ ! -f "$SRC_DIR/extract.py" ]; then
          rm -rf "$SRC_DIR"
          git clone --depth 1 https://github.com/fake-learn/PaperCropper "$SRC_DIR"
        fi

        python -m pip install --index-url https://download.pytorch.org/whl/cpu "torchvision==0.20.1+cpu"
        python -m pip install -r requirements-paper-media.txt
        python -m pip install --no-deps "doclayout-yolo==0.0.4"
        if [ ! -f "$MODEL_PATH" ]; then
          MODEL_DIR="$MODEL_DIR" python - <<'PY'
        import os
        from huggingface_hub import hf_hub_download

        filename = "doclayout_yolo_docstructbench_imgsz1280_2501.pt"
        path = hf_hub_download(
            repo_id="juliozhao/DocLayout-YOLO-DocStructBench-imgsz1280-2501",
            filename=filename,
            local_dir=os.environ["MODEL_DIR"],
            local_dir_use_symlinks=False,
        )
        print(path)
        PY
        fi

        PAPERCROPPER_MODEL="$MODEL_PATH" python - <<'PY'
        import os
        import cv2
        import fitz
        import torch
        import torchvision
        from doclayout_yolo import YOLOv10

        model_path = os.environ["PAPERCROPPER_MODEL"]
        if not os.path.exists(model_path):
            raise FileNotFoundError(model_path)
        print(
            "PaperCropper smoke OK:",
            {
                "torch": torch.__version__,
                "torchvision": torchvision.__version__,
                "cv2": cv2.__version__,
                "fitz": getattr(fitz, "__doc__", "")[:20],
                "YOLOv10": YOLOv10.__name__,
            },
        )
        PY

        echo "PAPERCROPPER_SCRIPT=$SRC_DIR/extract.py" >> "$GITHUB_ENV"
        echo "PAPERCROPPER_MODEL=$MODEL_PATH" >> "$GITHUB_ENV"
      if: steps.target.outputs.skip != 'true'
    - name: Recover exact publication day and protect existing results
      if: steps.target.outputs.skip != 'true'
      env:
        PAPER_DATE: ${{ matrix.paper_date }}
        HF_HOME: ${{ github.workspace }}/hf_cache
        HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/hf_cache
        HF_HUB_DISABLE_SYMLINKS: '1'
      run: |-
        set -euo pipefail
        python - <<'PYTHON'
        import hashlib, json, os
        from pathlib import Path
        paths = [Path(p) for p in ['config.yaml', 'docs/config.yaml', 'docs/README.md', 'archive/carryover.json', 'archive/arxiv_seen.json', 'archive/crawl_state.json']]
        for base in [Path('docs'), Path('archive')]:
            for p in base.rglob('*'):
                relative = p.relative_to(base).parts
                if p.is_file() and relative and relative[0].isdigit():
                    paths.append(p)
        protected = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()}
        Path(os.environ['RUNNER_TEMP'], 'dpr-protected.json').write_text(json.dumps(protected))
        PYTHON
        cp docs/README.md "$RUNNER_TEMP/dpr-home-before.md"
        trap 'cp "$RUNNER_TEMP/dpr-home-before.md" docs/README.md' EXIT
        python src/main.py --paper-date "$PAPER_DATE" --fetch-days 1 --fetch-mode standard --embedding-device cpu --embedding-batch-size 8
        cp "$RUNNER_TEMP/dpr-home-before.md" docs/README.md
        python - <<'PYTHON'
        import hashlib, json, os, sys
        from pathlib import Path
        sys.path.insert(0, 'src')
        from paper_date import papers_on_date
        from main import normalize_arxiv_id
        value = os.environ['PAPER_DATE']
        token = value.replace('-', '')
        protected = json.loads(Path(os.environ['RUNNER_TEMP'], 'dpr-protected.json').read_text())
        for name, expected in protected.items():
            path = Path(name)
            if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                raise SystemExit(f'Existing protected file changed: {name}')
        rec = Path('archive')/token/'recommend'/f'arxiv_papers_{token}.standard.json'
        payload = json.loads(rec.read_text())
        papers = payload.get('deep_dive', []) + payload.get('quick_skim', [])
        if len(papers_on_date(papers, value)) != len(papers):
            raise SystemExit('Recommendation contains wrong or missing publication date')
        ids = [normalize_arxiv_id(p.get('id') or p.get('paper_id')) for p in papers]
        if any(not pid for pid in ids) or len(set(ids)) != len(ids):
            raise SystemExit('Recommendation has empty or duplicate paper IDs')
        old_ids = set()
        for existing in Path('archive').glob('*/recommend/*.json'):
            if existing == rec:
                continue
            data = json.loads(existing.read_text())
            for paper in data.get('deep_dive', []) + data.get('quick_skim', []):
                old_ids.add(normalize_arxiv_id(paper.get('id') or paper.get('paper_id')))
        if old_ids.intersection(ids):
            raise SystemExit('Recommendation duplicates an existing historical paper ID')
        docs = Path('docs')/token[:6]/token[6:]
        for name in ['README.md', '_daily_state.json', 'papers.meta.json']:
            if not (docs/name).is_file():
                raise SystemExit(f'Missing day report file: {name}')
        print(f'{value}: validated {len(papers)} recommendations; old files and latest home preserved')
        PYTHON
    - name: Remove only this recovery day intermediates
      if: steps.target.outputs.skip != 'true'
      env:
        PAPER_DATE: ${{ matrix.paper_date }}
      run: |-
        token="${PAPER_DATE//-/}"
        rm -rf "archive/$token/raw" "archive/$token/filtered" "archive/$token/rank"
    - name: Commit validated recovery day
      if: steps.target.outputs.skip != 'true'
      env:
        PAPER_DATE: ${{ matrix.paper_date }}
      run: |-
        set -euo pipefail
        token="${PAPER_DATE//-/}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs "archive/$token/recommend"
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "[chore] recover papers for $PAPER_DATE" -m "Co-Authored-By: xixi <3495302215@qq.com>"
        git fetch origin main
        git rebase origin/main
        git push origin HEAD:main
    - name: Recovery day summary
      if: always()
      env:
        PAPER_DATE: ${{ matrix.paper_date }}
        JOB_STATUS: ${{ job.status }}
        SKIPPED: ${{ steps.target.outputs.skip }}
      run: 'echo "$PAPER_DATE: $JOB_STATUS (already complete: $SKIPPED)" >> "$GITHUB_STEP_SUMMARY"'
